name: release-test

# ★ k1LoW の release-test.yml の作法（ABSORB-20260823-k1low ①-3）: 本番のリリースと
#   同じビルドを毎 push で空撃ちする。「タグを打った日に初めてビルドが壊れている」を防ぐ。
#   さらに ailine 固有の合否条件を 1 つ足す ── refs/*.bas が配布物の中で生きているか。
#   （実測: zipapp では refs が例外も出さず 0 件になり、CI も --help も緑のまま生成品質だけ
#   落ちる。「静かに壊れる」形なので、数を機械で数える。）

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel -o dist
      - name: Install the wheel into a clean venv and verify the payload
        env:
          PYTHONUTF8: "1"
        run: |
          python -m venv .venv-check
          .venv-check\Scripts\python -m pip install --quiet (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          .venv-check\Scripts\python -c "import ailine, sys; refs=len(list(ailine.DEFAULT_REFS.glob('*.bas'))); helpers=len(list(ailine.DEFAULT_HELPERS.glob('*.bas'))); print('refs', refs, 'helpers', helpers); sys.exit(0 if refs >= 3 and helpers >= 1 else 1)"
          .venv-check\Scripts\ailine --help
          .venv-check\Scripts\ailine ops
