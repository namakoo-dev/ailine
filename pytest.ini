[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    local: 実機の ollama/LibreOffice/basrun 等、ローカル環境が要るテスト（CI では走らない。手動は `pytest -m local`）。
    real_normalize_book: normalize_book 自体の挙動（basrun_apply の呼び出し方・リトライ）を検証するテスト。
        tests/conftest.py の autouse fixture（normalize_book を既定で pass-through にする）の対象から外す
        （このテストは normalize_book 自身が実際に basrun_apply を呼ぶことを見たいため）。
