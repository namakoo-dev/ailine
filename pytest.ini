[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    local: 実機の ollama/LibreOffice/basrun 等、ローカル環境が要るテスト（CI では走らない。手動は `pytest -m local`）。
    daily: 実機の中でも**特に重い**もの（1 本で 30 分超）。push のたびには走らせず、日次で回す。
        ★ 2026-09-20 に分けた: matrix（245 検体の精度実測）が 2147 秒＝ push 全体の 55% を占めていた。
        ★ 外すだけだと誰も測らなくなるので、記録の measured_on が古くなったら赤くする番人を別に置く
        （tests/test_battery_number_is_current.py の『記録が古くなっていない』）。
        手動は `pytest -m daily`・pre-push は `-m "local and not daily"`。
    ollama_internals: ollama_generate 自身の挙動（エラーメッセージ等）を検証するテスト。conftest の _no_real_ollama 番人（実 ollama 呼び出しを boom にする）の対象から外す。
    real_normalize_book: normalize_book 自体の挙動（basrun_apply の呼び出し方・リトライ）を検証するテスト。
        tests/conftest.py の autouse fixture（normalize_book を既定で pass-through にする）の対象から外す
        （このテストは normalize_book 自身が実際に basrun_apply を呼ぶことを見たいため）。
