[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ailine"
# ★ 版はここが正（tagpr の版検出は `__version__` を厳密側で拾えず、ファイル中の最初の
#   semver に落ちる ── ソース中の "3.10" 等を掴む事故を避けるため pyproject に置く）。
version = "0.2.2"
description = "自然言語のタスクを、ローカル LLM が LibreOffice Basic に書き起こし、basrun で文書に適用し、効果を読み戻して検証する"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/namakoo-dev/ailine"

[project.scripts]
ailine = "ailine:_console_entry"

[tool.hatch.build.targets.wheel]
# ★ refs/*.bas と helpers/*.bas は「心臓」（7B への正解例の供給）。パッケージ内に同梱し、
#   ailine.py 側の `Path(__file__).parent / "refs"` を無改造のまま生かす（実測で 3/3 到達）。
packages = ["src/ailine", "src/ailine_core"]
